services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: tsingest-db
    environment:
      POSTGRES_USER: ingestor
      POSTGRES_PASSWORD: ingestor
      POSTGRES_DB: telemetry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - wal_compression=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingestor -d telemetry"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: tsingest-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqttdata:/mosquitto/data
    restart: unless-stopped

volumes:
  pgdata:
  mqttdata: